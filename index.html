<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KOWA 生地AR 試作01</title>
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
#guide{position:fixed;z-index:10;left:12px;right:12px;top:12px;padding:12px 14px;
background:rgba(5,26,58,.88);color:white;border-radius:12px;text-align:center}
</style>
</head>
<body>
<div id="guide">KOWA 生地AR 試作01<br>赤チェックの生地見本＋札をカメラに映してください</div>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">
  <a-assets>
    <img id="preview" src="./preview.png">
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
   <a-plane src="#preview" position="0 0 0.05" rotation="0 0 180" width="1.15" height="0.93"
         material="transparent:true; alphaTest:0.05"></a-plane>
  </a-entity>
</a-scene>
</body>
</html>
